<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        #btn{
            padding: 8px 12px;
        }
        #ul{
            list-style: none;
            padding: 0;
            margin: 12px 0 0;
        }
        #ul li{
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 6px 0;
        }
        #ul img{
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <!-- https://jsonplaceholder.typicode.com/photos 1~10까지 -->
    <button id="btn">데이터 가져오기</button>
    <ul id="ul"></ul>

    <script>
        const btn = document.getElementById('btn');
        const ul  = document.getElementById('ul');

        async function loadPhotos() {
        btn.disabled = true;
        btn.textContent = '로딩 중...';
        ul.innerHTML = '';

        try {
            const res = await fetch(
            'https://jsonplaceholder.typicode.com/photos?_start=0&_limit=10',
            { cache: 'no-store' }
            );
            if (!res.ok) throw new Error(res.status + ' ' + res.statusText);

            const photos = await res.json();
            const frag = document.createDocumentFragment();

            photos.forEach(p => {
            const li = document.createElement('li');

            const img = document.createElement('img');
            img.src = p.thumbnailUrl;
            img.alt = p.title;

            const span = document.createElement('span');
            span.textContent = `${p.id}. ${p.title}`;

            li.append(img, span);
            frag.appendChild(li);
            });

            ul.appendChild(frag);
        } catch (err) {
            console.error(err);
            ul.innerHTML = '<li style="color:#b00020">데이터를 불러오지 못했습니다.</li>';
        } finally {
            btn.disabled = false;
            btn.textContent = '데이터 가져오기';
        }
        }
        
        btn.addEventListener('click', loadPhotos);
    </script>
</body>
</html>
