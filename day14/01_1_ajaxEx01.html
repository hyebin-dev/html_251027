<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @font-face {
            font-family: ChangaOne-Regular;
            src: url(../font/Changa_One/ChangaOne-Regular.ttf);
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        body{
            margin: 0;
            padding: 0;
        }
        #header{
            text-align: center;
            margin-top: 40px;
        }
        #header h1{
            font-size: 40px;
            font-weight: 400;
            margin: 0 0 10px;
            font-family: ChangaOne-Regular;
        }
        #header p{
            font-weight: 700;
            margin: 0 0 30px;
        }
        #section{
            width: 80%;
            margin: 0 auto 40px;
            display: flex;
            justify-content: space-between;
        }
        #section article{
            width: 31%;
        }
        #section h2{
            margin: 0 0 10px;
            font-family: ChangaOne-Regular;
            font-weight: 400;
        }
        #section p{
            margin: 0 0 8px;
        }
        ul{
            margin: 0 0 0 20px;
        }
    </style>
</head>
<body>
    <!-- 
        https://mdn.github.io/learning-area/javascript/oojs/json/superheroes.json
    -->
    <header id="header"></header>
    <section id="section"></section>
    <script>
    (async function () {
        const url = 'https://mdn.github.io/learning-area/javascript/oojs/json/superheroes.json';
        const res = await fetch(url);
        const data = await res.json();

        const header = document.getElementById('header');
        const h1 = document.createElement('h1');
        h1.textContent = data.squadName; // Super Hero Squad
        const p = document.createElement('p');
        p.textContent = `HomeTown : ${data.homeTown} // Formed : ${data.formed}`;
        header.appendChild(h1);
        header.appendChild(p);

        const section = document.getElementById('section');
        data.members.forEach(m => {
            const article = document.createElement('article');

            const h2 = document.createElement('h2');
            h2.textContent = m.name;

            const secret = document.createElement('p');
            secret.innerHTML = 'SecretIdentity :<br>' + m.secretIdentity;

            const age = document.createElement('p');
            age.textContent = 'Age : ' + m.age;

            const powersTitle = document.createElement('p');
            powersTitle.textContent = 'SuperPowers :';

            const ul = document.createElement('ul');
            m.powers.forEach(power => {
                const li = document.createElement('li');
                li.textContent = power;
                ul.appendChild(li);
            });

            article.append(h2, secret, age, powersTitle, ul);
            section.appendChild(article);
        });
    })();
    </script>
    
</body>
</html>
